<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Project CZ · 青春纪事</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/smiley-sans/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ma-shan-zheng/index.css">
<style>
  :root {
    --f-story: '霞鹜文楷', 'LXGW WenKai', 'Kaiti SC', 'STKaiti', 'KaiTi', '楷体', serif;
    --f-ui: '霞鹜文楷GB', 'LXGW WenKai GB', 'LXGW WenKai', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    --f-title: '得意黑', 'Smiley Sans', 'ZCOOL KuaiLe', 'STHeiti', 'Microsoft YaHei', cursive;
    --f-brush: 'Ma Shan Zheng', '马善政毛笔楷书', 'Kaiti SC', 'STKaiti', 'KaiTi', '楷体', cursive;
    --bg-glass: rgba(180, 180, 190, .16);
    --border-glass: rgba(255, 255, 255, .18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; position: fixed; top: 0; left: 0; }
  body { font-family: var(--f-ui); background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); color: #f0e6d3; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
  #app { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; }
  @supports (height: 100dvh) { #app { width: 100dvw; height: 100dvh; } }/* ===== 横屏提示 ===== */
.rotate-hint { position: absolute; top: 1.6vh; left: 50%; transform: translateX(-50%); z-index: 40; display: flex; align-items: center; gap: .6em; background: rgba(0,0,0,.78); border: 1px solid rgba(255,255,255,.28); color: #f0e6d3; padding: clamp(8px,1.4vh,12px) clamp(14px,2vw,20px); border-radius: 999px; font-size: clamp(.8em,1.9vh,.95em); opacity: 0; pointer-events: none; transition: opacity .5s; white-space: nowrap; }
.rotate-hint.show { opacity: 1; pointer-events: auto; }
.rotate-hint .rh-icon { display: inline-block; animation: rotatePhone 2s ease-in-out infinite; }
.rotate-hint .rh-close { background: none; border: none; color: rgba(255,255,255,.7); font-size: 1em; cursor: pointer; padding: 0 0 0 .4em; font-family: inherit; }
@keyframes rotatePhone { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }

/* ===== 页面通用 ===== */
.page { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; position: absolute; top: 0; left: 0; padding: 2vh 3vw; }
.page.active { display: flex; }

/* ===== 首页 ===== */
#pg-home { background-image: linear-gradient(rgba(12,12,28,.55), rgba(12,12,28,.72)), url('shouye.jpg'), url('shouye.jpg'), linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); background-size: cover, cover, cover, auto; background-position: center; background-repeat: no-repeat; }
.home-title-area { position: absolute; left: 6vw; top: 50%; transform: translateY(-50%); display: flex; align-items: flex-start; gap: 1.6vw; }
.brush-title { writing-mode: vertical-rl; font-family: var(--f-brush); font-weight: 400; font-size: clamp(3em, 12vh, 6em); color: #f5f0e6; letter-spacing: .15em; text-shadow: 0 3px 22px rgba(0,0,0,.65); }
.title-side { display: flex; gap: .9vw; align-items: flex-start; padding-top: .7em; }
.sub-v { writing-mode: vertical-rl; font-size: clamp(.85em,2.2vh,1.1em); color: rgba(245,240,230,.7); letter-spacing: .35em; font-family: var(--f-story); animation: float 3s ease-in-out infinite; }
.seal { writing-mode: vertical-rl; background: #9e2b2b; color: #fff; font-family: var(--f-brush); font-size: clamp(.75em,1.9vh,.95em); padding: .45em .35em; border-radius: 4px; box-shadow: 0 2px 10px rgba(0,0,0,.45); animation: float 3s ease-in-out infinite .6s; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }.home-center { position: absolute; left: 50%; bottom: 5vh; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 1.6vh; }
.guide { font-style: italic; color: rgba(245,240,230,.6); font-size: clamp(.8em,1.9vh,.95em); text-align: center; font-family: var(--f-story); }
.btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,.45); color: #f0e6d3; padding: clamp(11px,1.8vh,16px) 0; width: clamp(220px,32vw,320px); font-size: clamp(1em,2.4vh,1.25em); letter-spacing: .4em; text-indent: .4em; border-radius: 3px; cursor: pointer; font-family: inherit; transition: all .3s; }
.btn-ghost:active { background: rgba(255,255,255,.15); border-color: #e94560; transform: scale(.96); }
.home-func { position: absolute; right: 3vw; bottom: 4vh; display: flex; flex-direction: column; gap: 1vh; }
.home-func button { background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.18); color: rgba(240,230,211,.85); padding: clamp(8px,1.4vh,12px) clamp(12px,1.8vw,18px); border-radius: 8px; font-size: clamp(.8em,1.9vh,.95em); cursor: pointer; font-family: inherit; transition: all .25s; text-align: center; }
.home-func button:active { background: rgba(255,255,255,.15); transform: scale(.96); }
.home-meta { position: absolute; left: 2.5vw; bottom: 6vh; display: flex; gap: 1.4em; font-size: clamp(.7em,1.6vh,.85em); color: rgba(240,230,211,.5); }
.version-tag { position: absolute; left: 2.5vw; bottom: 2.2vh; font-size: clamp(.6em,1.4vh,.75em); color: rgba(240,230,211,.28); cursor: pointer; transition: transform .12s; user-select: none; }
.version-tag:active { transform: scale(.9); }
.project-cz { position: absolute; right: 2.5vw; bottom: 2.2vh; font-size: clamp(.6em,1.4vh,.75em); color: rgba(240,230,211,.35); letter-spacing: .22em; user-select: none; }

/* ===== 全局按钮 ===== */
.fullscreen-btn { position: fixed; top: 1.5vh; right: 1.5vw; z-index: 50; padding: clamp(8px,1.5vh,12px) clamp(14px,2vw,20px); background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.3); border-radius: 8px; color: #fff; cursor: pointer; font-family: inherit; font-size: clamp(.8em,1.8vh,.95em); transition: opacity .5s ease; }
.fullscreen-btn.hidden { opacity: 0; pointer-events: none; }
.fullscreen-btn:active { transform: scale(.96); }
.music-btn { position: fixed; top: calc(1.5vh + 52px); left: 1.5vw; z-index: 50; padding: clamp(8px,1.5vh,12px) clamp(14px,2vw,20px); background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.3); border-radius: 8px; color: #fff; cursor: pointer; font-family: inherit; font-size: clamp(.9em,2vh,1.1em); }
.music-btn.hidden { display: none; }
.music-btn:active { transform: scale(.96); }
.btn-back { position: absolute; top: 1.5vh; left: 1.5vw; padding: clamp(10px,1.8vh,16px) clamp(18px,3vw,28px); background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.3); border-radius: 8px; color: #fff; cursor: pointer; font-family: inherit; font-size: clamp(.8em,1.9vh,.95em); letter-spacing: .15em; transition: all .25s; z-index: 15; }
.btn-back:active { background: rgba(255,255,255,.15); transform: scale(.96); }

/* ===== 游戏主界面 ===== */
#pg-game { justify-content: flex-end; padding-bottom: 2vh; }
.scene-image-wrap { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.scene-image-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
.scene-img-fallback { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; background: rgba(0,0,0,.3); color: rgba(255,255,255,.35); font-size: clamp(1em,2.5vh,1.4em); font-family: var(--f-ui); letter-spacing: .1em; }
.char-area { flex: 1; display: flex; align-items: center; justify-content: center; font-size: clamp(3em,8vh,5em); opacity: .3; width: 100%; z-index: 2; position: relative; }
#char-icon { transition: transform .15s, opacity .15s; }
.dialogue-wrap { position: relative; width: min(92%, 760px); margin: 0 auto; z-index: 5; }
.char-name-plate { position: absolute; bottom: 100%; left: clamp(14px,2.5vw,24px); margin-bottom: clamp(4px,.8vh,8px); background: var(--bg-glass); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); border: 1px solid var(--border-glass); border-radius: 8px; padding: clamp(5px,.9vh,9px) clamp(14px,2vw,20px); font-family: var(--f-story); font-weight: bold; font-size: clamp(1em,2.2vh,1.25em); color: #ff8aa0; z-index: 6; white-space: nowrap; }.dialogue-box { background: var(--bg-glass); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); padding: clamp(14px,2.2vh,22px) clamp(20px,3vw,32px); padding-bottom: clamp(26px,4vh,38px); border-radius: 14px; border: 1px solid var(--border-glass); min-height: clamp(90px,16vh,130px); cursor: pointer; width: 100%; position: relative; z-index: 5; }
.dlg-text { font-family: var(--f-story); line-height: 1.7; font-size: clamp(1em,2.3vh,1.2em); color: #f3f1ea; white-space: pre-wrap; }
.dlg-hint { position: absolute; right: clamp(10px,1.5vw,16px); bottom: clamp(6px,1vh,10px); font-size: clamp(.62em,1.4vh,.78em); color: rgba(255,255,255,.38); letter-spacing: .12em; }
.choices { position: absolute; bottom: calc(100% + 1.2vh); right: 0; display: none; flex-direction: column; gap: 1vh; width: clamp(230px,32vw,360px); z-index: 20; }
.choices.show { display: flex; }
.choice-btn { padding: clamp(9px,1.6vh,14px) clamp(14px,2vw,20px); background: var(--bg-glass); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); border: 1px solid var(--border-glass); border-radius: 10px; color: #f3f1ea; cursor: pointer; font-size: clamp(.85em,2vh,1.02em); font-family: var(--f-story); text-align: center; line-height: 1.5; transition: all .2s; text-shadow: 0 1px 4px rgba(0,0,0,.5); pointer-events: auto; position: relative; z-index: 20; }
.choice-btn:active { background: rgba(233,69,96,.4); border-color: #e94560; transform: scale(.96); }
.toolbar { position: absolute; top: calc(1.5vh + 52px); right: 1.5vw; display: flex; flex-direction: column; align-items: center; gap: 1vh; z-index: 15; }
.toolbar button { width: clamp(40px,6vh,54px); height: clamp(40px,6vh,54px); border: none; background: transparent; color: rgba(255,255,255,.85); cursor: pointer; font-size: clamp(1.3em,2.8vh,1.7em); display: flex; align-items: center; justify-content: center; transition: all .2s; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.toolbar button:active { transform: scale(.96); color: #e94560; }

/* ===== 存档管理页 ===== */
.slot-page-title { font-family: var(--f-title); font-size: clamp(1.6em,4vh,2.2em); color: #f4d03f; margin-bottom: 2vh; letter-spacing: .2em; }
.tabs { display: flex; gap: 1vw; margin-bottom: 2vh; }
.tab { padding: clamp(8px,1.4vh,12px) clamp(20px,3vw,30px); background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.2); border-radius: 8px; color: rgba(240,230,211,.6); cursor: pointer; font-family: inherit; font-size: clamp(.85em,2vh,1em); transition: all .25s; }
.tab.on { background: rgba(233,69,96,.3); border-color: #e94560; color: #fff; }
.slot-list { width: min(90%, 600px); max-height: 52vh; overflow-y: auto; display: flex; flex-direction: column; gap: 1vh; padding: 0 4px; }
.slot-card { background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.15); border-radius: 10px; padding: clamp(12px,1.8vh,16px) clamp(14px,2vw,20px); cursor: pointer; transition: all .2s; }
.slot-card:active { background: rgba(255,255,255,.1); transform: scale(.98); }
.slot-title { font-size: clamp(.9em,2vh,1.05em); color: #f0e6d3; margin-bottom: .4vh; }
.slot-time { font-size: clamp(.72em,1.6vh,.85em); color: rgba(240,230,211,.5); }
.slot-empty { color: rgba(240,230,211,.3); font-style: italic; }
.slot-actions { display: flex; gap: .8vw; margin-top: .8vh; }
.slot-actions button { padding: clamp(5px,.9vh,8px) clamp(12px,1.8vw,18px); background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); border-radius: 6px; color: #f0e6d3; cursor: pointer; font-family: inherit; font-size: clamp(.7em,1.5vh,.82em); transition: all .2s; }
.slot-actions button:active { background: rgba(255,255,255,.25); transform: scale(.95); }/* ===== 设置页 ===== */
.settings-panel { background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.18); border-radius: 16px; padding: clamp(24px,4vh,36px) clamp(24px,4vw,36px); width: min(92%, 420px); display: flex; flex-direction: column; gap: 2vh; }
.settings-title { font-family: var(--f-title); font-size: clamp(1.4em,3.5vh,1.8em); color: #f4d03f; text-align: center; letter-spacing: .3em; margin-bottom: 1vh; }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 1vw; padding: .6vh 0; }
.setting-label { font-size: clamp(.85em,1.9vh,1em); color: rgba(240,230,211,.85); min-width: 5em; }
.setting-value { flex: 1; display: flex; justify-content: flex-end; }
.setting-value input[type="range"] { width: 100%; max-width: 180px; accent-color: #e94560; }
.toggle-btn { padding: clamp(6px,1vh,9px) clamp(14px,2vw,20px); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.25); border-radius: 6px; color: rgba(240,230,211,.7); cursor: pointer; font-family: inherit; font-size: clamp(.8em,1.7vh,.92em); transition: all .25s; }
.toggle-btn.active { background: rgba(76,175,80,.35); border-color: #4caf50; color: #fff; }
.btn-logout { width: 100%; padding: clamp(10px,1.6vh,14px); background: rgba(233,69,96,.25); border: 1px solid rgba(233,69,96,.5); border-radius: 8px; color: #ff8a9e; cursor: pointer; font-family: inherit; font-size: clamp(.85em,1.9vh,1em); margin-top: 1vh; transition: all .25s; }
.btn-logout:active { background: rgba(233,69,96,.45); transform: scale(.97); }
.btn-close-settings { width: 100%; padding: clamp(10px,1.6vh,14px); background: transparent; border: 1px solid rgba(255,255,255,.35); border-radius: 8px; color: #f0e6d3; cursor: pointer; font-family: inherit; font-size: clamp(.85em,1.9vh,1em); transition: all .25s; }
.btn-close-settings:active { background: rgba(255,255,255,.12); transform: scale(.97); }

/* ===== 回顾面板 ===== */
.review-mask { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; opacity: 0; pointer-events: none; transition: opacity .35s; }
.review-mask.show { opacity: 1; pointer-events: auto; }
.review-panel { position: fixed; top: 0; right: 0; width: min(88vw, 420px); height: 100%; background: rgba(15,15,30,.96); border-left: 1px solid rgba(255,255,255,.15); z-index: 201; transform: translateX(105%); transition: transform .4s cubic-bezier(.22,1,.36,1); display: flex; flex-direction: column; }
.review-panel.show { transform: translateX(0); }
.review-head { display: flex; align-items: center; justify-content: space-between; padding: clamp(14px,2vh,20px) clamp(16px,2.5vw,24px); border-bottom: 1px solid rgba(255,255,255,.12); }
.review-title { font-family: var(--f-title); font-size: clamp(1.1em,2.5vh,1.35em); color: #f4d03f; }
.review-close { background: none; border: none; color: rgba(255,255,255,.6); font-size: clamp(1.2em,2.5vh,1.5em); cursor: pointer; padding: .2em; transition: color .2s; }
.review-close:active { color: #e94560; }
.review-list { flex: 1; overflow-y: auto; padding: clamp(12px,2vh,18px) clamp(14px,2vw,20px); display: flex; flex-direction: column; gap: 1.2vh; }
.review-item { font-family: var(--f-story); font-size: clamp(.82em,1.8vh,.95em); line-height: 1.6; color: rgba(243,241,234,.85); padding: clamp(8px,1.2vh,12px) clamp(10px,1.5vw,14px); background: rgba(255,255,255,.05); border-radius: 8px; border-left: 3px solid rgba(233,69,96,.5); }/* ===== 确认弹窗 ===== */
.confirm-mask { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 300; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .3s; }
.confirm-mask.show { opacity: 1; pointer-events: auto; }
.confirm-box { background: rgba(20,20,40,.95); border: 1px solid rgba(255,255,255,.2); border-radius: 14px; padding: clamp(22px,3.5vh,32px) clamp(22px,4vw,34px); width: min(88%, 340px); text-align: center; transform: scale(.9); transition: transform .3s; }
.confirm-mask.show .confirm-box { transform: scale(1); }
.confirm-title { font-family: var(--f-title); font-size: clamp(1.1em,2.5vh,1.35em); color: #f4d03f; margin-bottom: 1.2vh; }
.confirm-desc { font-size: clamp(.85em,1.9vh,1em); color: rgba(240,230,211,.8); margin-bottom: 2.2vh; line-height: 1.6; }
.confirm-actions { display: flex; gap: 1vw; }
.confirm-actions button { flex: 1; padding: clamp(9px,1.5vh,13px); background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); border-radius: 8px; color: #f0e6d3; cursor: pointer; font-family: inherit; font-size: clamp(.85em,1.9vh,1em); transition: all .2s; }
.confirm-actions button:active { background: rgba(255,255,255,.22); transform: scale(.96); }
.confirm-actions button.danger { background: rgba(233,69,96,.3); border-color: rgba(233,69,96,.6); color: #ff9eae; }
.confirm-actions button.danger:active { background: rgba(233,69,96,.5); }

/* ===== 提示气泡 ===== */
#toast { position: fixed; bottom: clamp(6vh,8vh,10vh); left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(0,0,0,.85); color: #fff; padding: clamp(10px,1.6vh,14px) clamp(20px,3vw,30px); border-radius: 999px; font-size: clamp(.82em,1.8vh,.95em); z-index: 500; opacity: 0; pointer-events: none; transition: all .35s; white-space: nowrap; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== 收录徽章 ===== */
.unlock-badge { position: fixed; top: clamp(8vh,10vh,12vh); left: 50%; transform: translateX(-50%) scale(0); background: linear-gradient(135deg, #f4d03f, #e67e22); color: #1a1a2e; padding: clamp(10px,1.6vh,14px) clamp(22px,3.5vw,32px); border-radius: 999px; font-family: var(--f-title); font-size: clamp(.9em,2vh,1.1em); z-index: 400; transition: transform .45s cubic-bezier(.68,-.55,.27,1.55); box-shadow: 0 4px 20px rgba(244,208,63,.4); }
.unlock-badge.show { transform: translateX(-50%) scale(1); }

/* ===== MC风格成就动画 ===== */
.mc-achievement { position: fixed; top: clamp(6vh,8vh,10vh); left: 50%; transform: translateX(-50%) translateY(-120px); z-index: 450; display: flex; align-items: center; gap: clamp(10px,1.5vw,16px); background: linear-gradient(180deg, #2d2d2d, #1a1a1a); border: 3px solid #555; border-radius: 4px; padding: clamp(10px,1.5vh,14px) clamp(16px,2.5vw,24px); box-shadow: 0 4px 0 #000, inset 0 2px 0 rgba(255,255,255,.1); opacity: 0; pointer-events: none; transition: all .5s cubic-bezier(.68,-.55,.27,1.55); }
.mc-achievement.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.mc-achievement .mc-icon { width: clamp(36px,5vh,48px); height: clamp(36px,5vh,48px); background: linear-gradient(135deg, #7cba3d, #4a8c1c); border: 2px solid #2d5a10; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: clamp(1.2em,2.5vh,1.6em); box-shadow: inset 0 -2px 0 rgba(0,0,0,.3); }
.mc-achievement .mc-text { display: flex; flex-direction: column; gap: .2vh; }
.mc-achievement .mc-label { font-family: var(--f-title); font-size: clamp(.7em,1.5vh,.85em); color: #f4d03f; letter-spacing: .1em; text-transform: uppercase; }
.mc-achievement .mc-title { font-family: var(--f-ui); font-size: clamp(.95em,2.1vh,1.15em); color: #fff; text-shadow: 2px 2px 0 #000; }
.mc-particle { position: fixed; width: 6px; height: 6px; background: #f4d03f; z-index: 449; pointer-events: none; animation: mcParticle .8s ease-out forwards; }
@keyframes mcParticle { 0% { opacity: 1; transform: translate(0,0) scale(1); } 100% { opacity: 0; transform: translate(var(--px), var(--py)) scale(0); } }  /* ===== 图鉴系统 ===== */
  .codex-btn { position: absolute; top: calc(1.5vh + 52px); left: calc(1.5vw + 70px); z-index: 15; padding: clamp(8px,1.4vh,12px) clamp(12px,2vw,18px); background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.3); border-radius: 8px; color: #fff; cursor: pointer; font-family: inherit; font-size: clamp(.8em,1.8vh,.95em); transition: all .25s; }
  .codex-btn:active { background: rgba(255,255,255,.15); transform: scale(.96); }
  .codex-mask { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 250; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .35s; }
  .codex-mask.show { opacity: 1; pointer-events: auto; }
  .codex-panel { background: linear-gradient(180deg, #1e1e3a, #12122a); border: 2px solid rgba(244,208,63,.3); border-radius: 16px; width: min(92%, 560px); max-height: 80vh; display: flex; flex-direction: column; overflow: hidden; transform: scale(.92); transition: transform .35s; }
  .codex-mask.show .codex-panel { transform: scale(1); }

function showToast(msg) {

  if (!toast) return;
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);

// ===== 登录系统 =====
function initLogin() {
  const overlay = document.getElementById('login-overlay');
  const panel = document.getElementById('login-panel');
  const accountInput = document.getElementById('login-account');
  const passwordInput = document.getElementById('login-password');
  const errorText = document.getElementById('login-error');
  const loginBtn = document.getElementById('login-btn');
  if (!overlay || !accountInput || !passwordInput || !loginBtn) return;

  if (localStorage.getItem('logged_user')) {
    overlay.style.display = 'none';
    return;
  }

  function showLoginError() {
    if (errorText) errorText.classList.add('show');
    if (panel) {
      panel.classList.remove('shake');
      void panel.offsetWidth;
      panel.classList.add('shake');
      setTimeout(() => panel.classList.remove('shake'), 450);
    }
  }

  function doLogin() {
    const acc = accountInput.value.trim();
    const pwd = passwordInput.value.trim();
    if (!acc || !pwd) { showLoginError(); return; }

    const found = ACCOUNT_POOL.find(function(it) {
      return it.account === acc && it.password === pwd;
    });

    if (found) {
      localStorage.setItem('logged_user', JSON.stringify({ account: acc, time: Date.now() }));
      var bgm = document.getElementById('bgm');
      if (bgm) {
        bgm.volume = 0.5;
        bgm.play().catch(function() {});
      }
      if (errorText) errorText.classList.remove('show');
      overlay.classList.add('fade-out');
      setTimeout(function() { overlay.style.display = 'none'; }, 600);
      showToast('欢迎回来，' + acc);
    } else {
      showLoginError();
    }

// ===== 多媒体素材探测与加载 =====
var mediaCache = {};

function detectMedia(fileName, type) {
  if (!fileName) return null;
  if (mediaCache[fileName]) return mediaCache[fileName];
  var exts = [];
  if (type === 'image') exts = ['.webp', '.jpg', '.jpeg', '.png', '.avif'];
  else if (type === 'audio') exts = ['.mp3', '.m4a', '.aac', '.ogg', '.wav', '.flac'];
  else if (type === 'video') exts = ['.mp4', '.webm', '.mov', '.avi'];
  else return null;
  mediaCache[fileName] = fileName + exts[0];
  return mediaCache[fileName];
}

function loadMediaForLine(line) {
  var wrap = document.getElementById('scene-image-wrap');
  if (!wrap) return;
  wrap.innerHTML = '';
  showLoadingIndicator(wrap);
  if (line.video) {
    tryVideoFormats(line.video, wrap);
    return;
  }
  if (line.img) {
    tryImageFormats(line.img, wrap);
    return;
  }
  if (line.sfx) {
    playAudio(line.sfx);
  }
  hideLoadingIndicator(wrap);
}
function tryImageFormats(baseName, wrap) {
  var exts = ['.webp', '.jpg', '.jpeg', '.png', '.avif'];
  var index = 0;
  function next() {
    if (index >= exts.length) {
      hideLoadingIndicator(wrap);
      var fb = document.createElement('div');
      fb.className = 'scene-img-fallback';
      fb.textContent = baseName + ' 未加载';
      wrap.appendChild(fb);
      return;
    }
    var url = baseName + exts[index];
    var img = new Image();
    img.onload = function() {
      hideLoadingIndicator(wrap);
      wrap.innerHTML = '';
      img.style.maxWidth = '100%';
      img.style.maxHeight = '100%';
      img.style.objectFit = 'contain';
      wrap.appendChild(img);
    };
    img.onerror = function() {
      index++;
      next();
    };
    img.src = url;
  }
  next();
}

function tryVideoFormats(baseName, wrap) {
  var exts = ['.mp4', '.webm', '.mov'];
  var index = 0;
  function next() {
    if (index >= exts.length) {
      hideLoadingIndicator(wrap);
      var fb = document.createElement('div');
      fb.className = 'scene-img-fallback';
      fb.textContent = baseName + ' 视频未加载';
      wrap.appendChild(fb);
      return;
    }
    var url = baseName + exts[index];
    var video = document.createElement('video');
    video.src = url;
    video.autoplay = true;
    video.muted = true;
    video.loop = false;
    video.playsInline = true;
    video.style.maxWidth = '100%';
    video.style.maxHeight = '100%';
    video.style.objectFit = 'contain';
    video.onloadeddata = function() {
      hideLoadingIndicator(wrap);
      wrap.innerHTML = '';
      wrap.appendChild(video);
    };
    video.onerror = function() {
      index++;
      next();
    };
  }
  next();
}

function playAudio(baseName) {
  var exts = ['.mp3', '.m4a', '.aac', '.ogg', '.wav', '.flac'];
  var index = 0;
  function next() {
    if (index >= exts.length) return;
    var audio = new Audio();
    audio.src = baseName + exts[index];
    audio.volume = 0.5;
    audio.oncanplay = function() {
      audio.play().catch(function() {});
    };
    audio.onerror = function() {
      index++;
      next();
    };
  }
  next();
}

function showLoadingIndicator(wrap) {
  var loading = wrap.querySelector('.loading-overlay');
  if (!loading) {
    loading = document.createElement('div');
    loading.className = 'loading-overlay';
    loading.innerHTML = '<div class="loading-spinner"></div>';
    wrap.appendChild(loading);
  }
  loading.classList.add('show');
}

function hideLoadingIndicator(wrap) {
  var loading = wrap.querySelector('.loading-overlay');
  if (loading) loading.classList.remove('show');
}

function preloadNextLine() {
  var nextLine = STORY_DATA[currentScene] ? STORY_DATA[currentScene].lines[currentLine + 1] : null;
  if (!nextLine) return;
  if (nextLine.img) {
    var img = new Image();
    img.src = nextLine.img + '.jpg';
  }
  if (nextLine.video) {
    var video = document.createElement('video');
    video.preload = 'auto';
    video.src = nextLine.video + '.mp4';
  }
  if (nextLine.sfx) {
    var audio = new Audio();
    audio.preload = 'auto';
    audio.src = nextLine.sfx + '.mp3';
  }
}

// ===== 游戏流程 =====
function newGame() {
  currentScene = 0;
  currentLine = 0;
  showPage('pg-game');
  renderLine();
  showToast('开始新的篇章');
  unlockAchievement('first_meet');
}

function continueGame() {
  var data = localStorage.getItem('cz_save_auto');
  if (data) {
    var parsed = JSON.parse(data);
    currentScene = parsed.scene || 0;
    currentLine = parsed.line || 0;
    showPage('pg-game');
    renderLine();
    showToast('已继续上次进度');
  } else { newGame(); }
}
function renderLine() {
  var scene = STORY_DATA[currentScene];
  var line = scene ? scene.lines[currentLine] : null;
  if (!scene || !line) {
    stopAuto(); stopSkip();
    unlockAchievement('chapter_1');
    showToast('—— 本章结束 ——');
    setTimeout(function() { showPage('pg-home'); }, 900);
    return;
  }

  var textEl = document.getElementById('dlg-text');
  var nameEl = document.getElementById('char-name');
  var iconEl = document.getElementById('char-icon');
  var choicesEl = document.getElementById('choices');
  if (!textEl || !nameEl || !iconEl || !choicesEl) return;

  choicesEl.classList.remove('show');
  choicesEl.innerHTML = '';

  loadMediaForLine(line);

  if (line.type === 'narration') {
    nameEl.textContent = '旁白';
    iconEl.textContent = '📖';
    typeText(textEl, line.text);
  } else if (line.type === 'dialogue') {
    nameEl.textContent = line.speaker;
    iconEl.textContent = line.icon || '🧑';
    typeText(textEl, line.text);
  } else if (line.type === 'choice') {
    stopAuto();
    nameEl.textContent = '选择';
    iconEl.textContent = '💭';
    textEl.textContent = line.prompt;
    line.options.forEach(function(opt, idx) {
      var btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = opt.text;
      btn.style.pointerEvents = 'auto';
      btn.style.position = 'relative';
      btn.style.zIndex = '20';
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        currentLine = opt.next;
        if (idx === 0) unlockAchievement('first_choice');
        renderLine();
      });
      choicesEl.appendChild(btn);
    });
    setTimeout(function() { choicesEl.classList.add('show'); }, 200);
  }
}

function typeText(el, text) {
  clearInterval(typeTimer);
  if (skipMode) { el.textContent = text; isTyping = false; return; }
  isTyping = true;
  el.textContent = '';
  var i = 0;
  var speed = getSpeed();
  typeTimer = setInterval(function() {
    if (i < text.length) { el.textContent += text[i]; i++; }
    else {
      clearInterval(typeTimer);
      isTyping = false;
      if (autoMode) scheduleAuto();
    }
  }, speed);
}

function getSpeed() {
  var el = document.getElementById('set-speed');
  var val = el ? parseInt(el.value) : 50;
  return Math.max(10, 80 - val * 0.7);
}

function advance() {
  preloadNextLine();
  var scene = STORY_DATA[currentScene];
  if (!scene) return;
  var line = scene.lines[currentLine];
  if (!line || line.type === 'choice') return;
  if (isTyping) {
    clearInterval(typeTimer);
    isTyping = false;
    document.getElementById('dlg-text').textContent = line.text;
    if (autoMode) scheduleAuto();
    return;
  }
  currentLine++;
  renderLine();
}
// ===== 自动 / 快进 =====
function stopAuto() { autoMode = false; clearTimeout(autoTimer); }
function stopSkip() { skipMode = false; clearInterval(skipTimer); }
function toggleAuto() {
  autoMode = !autoMode;
  showToast(autoMode ? '自动播放：开' : '自动播放：关');
  if (autoMode && !isTyping) scheduleAuto();
  if (!autoMode) clearTimeout(autoTimer);
}
function scheduleAuto() {
  clearTimeout(autoTimer);
  var el = document.getElementById('set-auto-delay');
  var delay = (el ? parseInt(el.value) : 2) * 1000;
  autoTimer = setTimeout(function() { if (autoMode) advance(); }, delay);
}
function toggleSkip() {
  skipMode = !skipMode;
  showToast(skipMode ? '快进模式：开' : '快进模式：关');
  if (skipMode) {
    skipTimer = setInterval(function() {
      var scene = STORY_DATA[currentScene];
      var line = scene ? scene.lines[currentLine] : null;
      if (!scene || !line || line.type === 'choice') { toggleSkip(); return; }
      clearInterval(typeTimer); isTyping = false;
      currentLine++;
      renderLine();
    }, 200);
  } else { clearInterval(skipTimer); }
}

  if (tabLoad) tabLoad.classList.toggle('on', tab === 'load');

function renderSlots(tab) {
  var list = document.getElementById('slot-list');
  if (!list) return;
  list.innerHTML = '';
  for (var i = 1; i <= 6; i++) {
    var data = localStorage.getItem('cz_slot_' + i);
    var card = document.createElement('div');
    card.className = 'slot-card';
    if (data) {
      var parsed = JSON.parse(data);
      card.innerHTML =
        '<div class="slot-title">存档 ' + i + ' · ' + (parsed.name || '未命名') + '</div>' +
        '<div class="slot-time">' + (parsed.time || '未知时间') + '</div>' +
        '<div class="slot-actions">' +
        (tab === 'load' ? '<button onclick="loadSlot(' + i + ')">读取</button>' : '') +
        '<button onclick="deleteSlot(' + i + ', event)">删除</button>' +
        '</div>';
    } else {
      card.innerHTML = '<div class="slot-title">存档 ' + i + '</div><div class="slot-time slot-empty">空</div>';
    }
    if (tab === 'save') {
      (function(slotIndex) {
        card.onclick = function() { saveToSlot(slotIndex); };
      })(i);
    }
    list.appendChild(card);
  }
}

function saveToSlot(i) {
  var scene = STORY_DATA[currentScene];
  var data = {
    scene: currentScene, line: currentLine,
    name: scene ? scene.name : '未知',
    time: new Date().toLocaleString('zh-CN')
  };
  var key = 'cz_slot_' + i;
  if (localStorage.getItem(key)) {
    showConfirm('覆盖存档', '存档 ' + i + ' 已有数据，确定覆盖？', function() {
      localStorage.setItem(key, JSON.stringify(data));
      showToast('已保存到存档 ' + i);
      renderSlots(currentTab);
    });
  } else {
    localStorage.setItem(key, JSON.stringify(data));
    showToast('已保存到存档 ' + i);
    renderSlots(currentTab);
  }
}

function loadSlot(i) {
  var data = localStorage.getItem('cz_slot_' + i);
  if (data) {
    var parsed = JSON.parse(data);
    currentScene = parsed.scene; currentLine = parsed.line;
    showPage('pg-game'); renderLine();
    showToast('已读取存档 ' + i);
  }
}

function deleteSlot(i, e) {
  if (e && e.stopPropagation) e.stopPropagation();
  localStorage.removeItem('cz_slot_' + i);
  showToast('存档 ' + i + ' 已删除');

    div.className = 'codex-item ' + (unlocked ? 'unlocked' : 'locked');
    div.innerHTML =
      '<div class="ci-icon">' + (unlocked ? item.icon : '🔒') + '</div>' +
      '<div class="ci-name">' + (unlocked ? item.name : '???') + '</div>' +
      '<div class="ci-desc">' + (unlocked ? item.desc : '尚未解锁') + '</div>';
    body.appendChild(div);
  });
}
function unlockCodex(id) {
  if (codexUnlocked.indexOf(id) === -1) {
    codexUnlocked.push(id);
    localStorage.setItem('cz_codex', JSON.stringify(codexUnlocked));
  }
}

// ===== MC风格成就系统 =====
function unlockAchievement(id) {
  if (achievements[id]) return;
  achievements[id] = true;
  localStorage.setItem('cz_achievements', JSON.stringify(achievements));
  var data = null;
  for (var i = 0; i < ACHIEVEMENT_DATA.length; i++) {
    if (ACHIEVEMENT_DATA[i].id === id) { data = ACHIEVEMENT_DATA[i]; break; }
  }
  if (!data) return;
  var el = document.getElementById('mc-achievement');
  var titleEl = document.getElementById('mc-achievement-title');
  if (!el || !titleEl) return;
  var iconEl = el.querySelector('.mc-icon');
  titleEl.textContent = data.title;
  if (iconEl) iconEl.textContent = data.icon;
  el.classList.add('show');
  spawnMCParticles();
  setTimeout(function() { el.classList.remove('show'); }, 3500);
  if (id === 'first_meet') { unlockCodex('lin'); unlockCodex('chen'); }
  if (id === 'chapter_1') { unlockCodex('school'); unlockCodex('autumn'); }
}

function spawnMCParticles() {
  var el = document.getElementById('mc-achievement');
  if (!el) return;
  var rect = el.getBoundingClientRect();
  var cx = rect.left + rect.width / 2;
  var cy = rect.top + rect.height / 2;
  var colors = ['#f4d03f', '#e67e22', '#7cba3d', '#fff'];
  for (var i = 0; i < 12; i++) {
    var p = document.createElement('div');
    p.className = 'mc-particle';
    var angle = (Math.PI * 2 / 12) * i;
    var dist = 40 + Math.random() * 60;
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.setProperty('--px', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--py', Math.sin(angle) * dist + 'px');
    p.style.background = colors[i % 4];
    document.body.appendChild(p);
    (function(particle) {
      setTimeout(function() { if (particle.parentNode) particle.parentNode.removeChild(particle); }, 900);
    })(p);
  }
}

// ===== 确认弹窗 =====
var confirmCallback = null;
function showConfirm(title, desc, callback) {
  var mask = document.getElementById('confirm-mask');
  var titleEl = document.getElementById('confirm-title');
  var descEl = document.getElementById('confirm-desc');
  if (!mask || !titleEl || !descEl) return;
  titleEl.textContent = title;
  descEl.textContent = desc;
  mask.classList.add('show');
  confirmCallback = callback;
  var okBtn = document.getElementById('confirm-ok');
  if (okBtn) {
    okBtn.onclick = function() {
      hideConfirm();
      if (confirmCallback) confirmCallback();
    };
  }
}
function hideConfirm() {
  var mask = document.getElementById('confirm-mask');
  if (mask) mask.classList.remove('show');
  confirmCallback = null;
}

// ===== 设置 =====
function toggleBGM() {
  var btn = document.getElementById('toggle-bgm');
  if (!btn) return;
  var isOn = btn.classList.contains('active');
  btn.classList.toggle('active');
  btn.textContent = isOn ? '关闭' : '开启';
}

// ===== 增强版彩蛋 =====
var eggCount = 0, eggResetTimer = null;
function tapVersion() {
  eggCount++;
  clearTimeout(eggResetTimer);
  eggResetTimer = setTimeout(function() { eggCount = 0; }, 1500);
  if (eggCount >= 10) {
    eggCount = 0;
    triggerEgg();
  }
}

function triggerEgg() {
  var overlay = document.getElementById('egg-overlay');
  if (!overlay) return;
  overlay.classList.add('show');
  unlockAchievement('egg_hunter');
  var app = document.getElementById('app');
  if (app) {
    app.style.animation = 'none';
    void app.offsetWidth;
    app.style.animation = 'screenShake .5s ease .7s';
  }
  spawnFlames();
  setTimeout(function() { hideEgg(); }, 4000);
}

function spawnFlames() {
  for (var i = 0; i < 20; i++) {
    (function(idx) {
      setTimeout(function() {
        var f = document.createElement('div');
        f.className = 'egg-flame';
        f.style.left = (Math.random() * 100) + 'vw';
        f.style.animationDelay = (Math.random() * 0.3) + 's';
        var size = (4 + Math.random() * 6) + 'px';
        f.style.width = size;
        f.style.height = size;
        document.body.appendChild(f);
        setTimeout(function() { if (f.parentNode) f.parentNode.removeChild(f); }, 1200);
      }, idx * 80);
    })(i);
  }
}

function hideEgg() {
  var overlay = document.getElementById('egg-overlay');
  if (overlay) overlay.classList.remove('show');
  var app = document.getElementById('app');
  if (app) app.style.animation = '';
}

// ===== 初始化 =====
checkOrientation();
if (codexUnlocked.length === 0) unlockCodex('teacher');
initLogin();
</script>
