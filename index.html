<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Project CZ · 青春纪事</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/smiley-sans/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ma-shan-zheng/index.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="liquid-refract" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="16" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div id="app">

  <!-- ===== 首页背景音乐 ===== -->
  <audio id="bgm" src="首页音乐.mp3" loop preload="auto" style="display:none;"></audio>

  <!-- ===== 横屏提示 ===== -->
  <div class="rotate-hint" id="rotate-hint">
    <span class="rh-icon">📱</span> 建议横屏体验以获得最佳效果
    <button class="rh-close" onclick="dismissRotateHint()">✕</button>
  </div>

  <!-- ===== 登录界面 ===== -->
  <div id="login-overlay">
    <div class="login-panel" id="login-panel">
      <div class="login-title">青春纪事</div>
      <input type="text" class="login-input" id="login-account" placeholder="账号" autocomplete="off">
      <input type="password" class="login-input" id="login-password" placeholder="密码" autocomplete="off">
      <div class="login-error" id="login-error">账号或密码错误，请重试</div>
      <button class="login-btn" id="login-btn">进 入 游 戏</button>
    </div>
  </div>
  <!-- ===== 首页 ===== -->
  <div class="page active" id="pg-home">
    <button class="fullscreen-btn hidden" id="fullscreen-btn" onclick="toggleFullscreen()">⛶ 全屏</button>

    <div class="home-title-area">
      <div class="brush-title">青春纪事</div>
      <div class="title-side">
        <div class="sub-v">校园唐人物语</div>
        <div class="seal">测试版</div>
      </div>
    </div>

    <div class="home-center">
      <div class="guide">— 新学期 · 新的相遇 —</div>
      <button class="btn-ghost" onclick="newGame()">新的篇章</button>
      <button class="btn-ghost" onclick="continueGame()">继续旅程</button>
    </div>

    <div class="home-func">
      <button onclick="openSlots()" data-icon="folder">存档</button>
      <button onclick="openGrowth()" data-icon="chart">成长</button>
      <button id="settings-btn-home" onclick="openSettings()" data-icon="settings">设置</button>
      <button onclick="openAch()" data-icon="trophy">成就</button>
      <button onclick="openCodex()" data-icon="book">图鉴</button>
    </div>

    <div class="home-meta">
      <span>测试版</span>
      <span>本地存档</span>
    </div>

    <div class="version-tag" id="version-tag" onclick="tapVersion()">v0.4.0</div>
    <div class="project-cz">Project CZ</div>
  </div>
  <!-- ===== 游戏主界面 ===== -->
  <div class="page" id="pg-game">
    <button class="btn-back" onclick="showPage('pg-home')" data-icon="back">返回</button>
    <button class="fullscreen-btn hidden" id="fullscreen-btn-game" onclick="toggleFullscreen()">⛶</button>
    <button class="music-btn hidden" id="music-btn" onclick="toggleMusic()" data-icon="volume"></button>
    <button class="codex-btn" onclick="openCodex()" data-icon="book">图鉴</button>
    

    <div class="scene-image-wrap" id="scene-image-wrap">
      <div class="scene-img-fallback" id="scene-img-fallback"></div>
    </div>

    <div class="toolbar">
      <button onclick="toggleAuto()" title="自动播放" data-icon="play"></button>
      <button onclick="toggleSkip()" title="快进" data-icon="skip"></button>
      <button onclick="saveGame()" title="存档" data-icon="save"></button>
      <button onclick="loadGame()" title="读档" data-icon="folder"></button>
      <button onclick="openReview()" title="回顾" data-icon="history"></button>
      <button id="settings-btn-game" onclick="openSettings()" title="设置" data-icon="settings"></button>
    </div>

    <div class="char-area"><span id="char-icon">🧑‍🎓</span></div>

    <div class="dialogue-wrap">
      <div class="char-name-plate" id="char-name">???</div>
      <div class="dialogue-box" id="dlg-box" onclick="advance()">
        <div class="dlg-text" id="dlg-text"></div>
        <div class="dlg-hint">点击继续 ▸</div>
      </div>
      <div id="debug-info"></div>
      <div class="choices" id="choices"></div>
    </div>
  </div>
    <!-- ===== 存档管理弹窗 ===== -->
  <div class="slots-mask" id="slots-mask" onclick="closeSlots()">
    <div class="slots-panel" onclick="event.stopPropagation()">
      <div class="slots-head">
        <div class="slots-title">存档管理</div>
        <button class="slots-close" onclick="closeSlots()"></button>
      </div>
      <div class="slots-body">
        <div class="tabs">
          <button class="tab on" id="tab-save" onclick="switchTab('save')">存 档</button>
          <button class="tab" id="tab-load" onclick="switchTab('load')">读 档</button>
        </div>
        <div class="slot-list" id="slot-list"></div>
      </div>
    </div>
  </div>
  <!-- ===== 设置弹窗 ===== -->
  <div class="settings-mask" id="settings-mask" onclick="closeSettings()">
    <div class="settings-panel" onclick="event.stopPropagation()">
      <div class="settings-head">
        <div class="settings-title">设 置</div>
        <button class="settings-close" onclick="closeSettings()"></button>
      </div>
      <div class="settings-body">
        <div class="setting-row">
          <span class="setting-label">文字速度</span>
          <div class="setting-value">
            <input type="range" id="set-speed" min="0" max="100" value="50">
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">自动延迟</span>
          <div class="setting-value">
            <input type="range" id="set-auto-delay" min="1" max="5" value="2">
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">背景音乐</span>
          <div class="setting-value">
            <button class="toggle-btn active" id="toggle-bgm" onclick="toggleBGM()">开启</button>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">画质特效</span>
          <div class="setting-value">
            <button class="toggle-btn active" id="toggle-quality" onclick="toggleQuality()">全量</button>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">开发者模式</span>
          <div class="setting-value">
            <button class="toggle-btn" id="toggle-dev" onclick="toggleDevMode()">关闭</button>
          </div>
        </div>
        <button class="btn-settings-action" onclick="showChangelog()"> 更新日志</button>
        <button class="btn-settings-action" onclick="openBugReport()"> Bug反馈</button>

        <button class="btn-logout" onclick="logout()">退出登录</button>
        <button class="btn-close-settings" onclick="closeSettings()">关 闭</button>
      </div>
    </div>
  </div>

  <!-- ===== 成长弹窗 ===== -->
  <div class="growth-mask" id="growth-mask" onclick="closeGrowth()">
    <div class="growth-panel" onclick="event.stopPropagation()">
      <div class="growth-head">
        <div class="growth-title"> 成长系统</div>
        <button class="growth-close" onclick="closeGrowth()"></button>
      </div>
      <div class="growth-body">
        <div class="stats-section-title"> 角色好感度</div>
        <div id="growth-fav-display"></div>
        <div class="stats-section-title" style="margin-top:1.5vh;"> 四维属性</div>
        <div id="growth-stats-display"></div>
        <button class="btn-settings-action" style="margin-top:2vh; background:rgba(233,69,96,.25); border-color:rgba(233,69,96,.5); color:#ff9eae;" onclick="resetAllStats()"> 重置所有数值</button>
      </div>
    </div>
  </div>

  <!-- ===== 成就弹窗 ===== -->
  <div class="ach-mask" id="ach-mask" onclick="closeAch()">
    <div class="ach-panel" onclick="event.stopPropagation()">
      <div class="ach-head">
        <div class="ach-title"> 成就</div>
        <button class="ach-close" onclick="closeAch()"></button>
      </div>
      <div class="ach-body" id="ach-list"></div>
    </div>
  </div>
  <!-- ========== 全局浮层 ========== -->

  <div class="review-mask" id="review-mask" onclick="closeReview()"></div>
  <div class="review-panel" id="review-panel">
    <div class="review-head">
      <div class="review-title">📜 对话回顾</div>
      <button class="review-close" onclick="closeReview()">✕</button>
    </div>
    <div class="review-list" id="review-list"></div>
  </div>

  <div class="codex-mask" id="codex-mask" onclick="closeCodex()">
    <div class="codex-panel" onclick="event.stopPropagation()">
      <div class="codex-head">
        <div class="codex-title">📖 图 鉴</div>
        <button class="codex-close" onclick="closeCodex()">✕</button>
      </div>
      <div class="codex-body" id="codex-body"></div>
    </div>
  </div>

  <div id="glass-achievement-container"></div>

  <div class="confirm-mask" id="confirm-mask">
    <div class="confirm-box">
      <div class="confirm-title" id="confirm-title">确认操作</div>
      <div class="confirm-desc" id="confirm-desc"></div>
      <div class="confirm-actions">
        <button onclick="hideConfirm()">取消</button>
        <button class="danger" id="confirm-ok">确定</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <div class="unlock-badge" id="unlock-badge">📖 已收录</div>

  <div id="egg-overlay" onclick="hideEgg()">
    <div class="egg-box">
      <div class="egg-text">我身边怎么有那么多臭婊子？！</div>
      <div class="egg-sub">—— 点击任意处平息怒火 ——</div>
    </div>
  </div>

</div><!-- /#app -->
<script src="script.js"></script>
</body>
</html>
