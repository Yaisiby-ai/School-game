<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Project CZ · 青春纪事</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/smiley-sans/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ma-shan-zheng/index.css">
<style>
  :root {
    --f-story: '霞鹜文楷', 'LXGW WenKai', 'Kaiti SC', 'STKaiti', 'KaiTi', '楷体', serif;
    --f-ui: '霞鹜文楷GB', 'LXGW WenKai GB', 'LXGW WenKai', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    --f-title: '得意黑', 'Smiley Sans', 'ZCOOL KuaiLe', 'STHeiti', 'Microsoft YaHei', cursive;
    --f-brush: 'Ma Shan Zheng', '马善政毛笔楷书', 'Kaiti SC', 'STKaiti', 'KaiTi', '楷体', cursive;
    /* 暖调玻璃升级 */
    --bg-glass: rgba(220, 200, 180, .12);
    --border-glass: rgba(230, 210, 185, .30);
    --glass-blur: 4px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; position: fixed; top: 0; left: 0; }
  body { font-family: var(--f-ui); background: linear-gradient(135deg, #2b2b3a, #3a3545); color: #f0e6d3; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
  #app { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; }
  @supports (height: 100dvh) { #app { width: 100dvw; height: 100dvh; } }/* ===== 横屏提示 ===== */
.rotate-hint { position: absolute; top: 1.6vh; left: 50%; transform: translateX(-50%); z-index: 40; display: flex; align-items: center; gap: .6em; background: var(--bg-glass); backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur)); border: 1px solid var(--border-glass); color: #f0e6d3; padding: clamp(8px,1.4vh,12px) clamp(14px,2vw,20px); border-radius: 999px; font-size: clamp(.8em,1.9vh,.95em); opacity: 0; pointer-events: none; transition: opacity .5s; white-space: nowrap; }
.rotate-hint.show { opacity: 1; pointer-events: auto; }
.rotate-hint .rh-icon { display: inline-block; animation: rotatePhone 2s ease-in-out infinite; }
.rotate-hint .rh-close { background: none; border: none; color: rgba(255,255,255,.7); font-size: 1em; cursor: pointer; padding: 0 0 0 .4em; font-family: inherit; }
@keyframes rotatePhone { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }

/* ===== 页面通用 ===== */
.page { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; position: absolute; top: 0; left: 0; padding: 2vh 3vw; opacity: 0; transition: opacity .3s ease; }
.page.active { display: flex; opacity: 1; transition: opacity 0.25s ease, transform 0.35s cubic-bezier(0.25, 1.2, 0.35, 1); }

/* ===== 首页 ===== */
#pg-home { background-image: linear-gradient(rgba(12,12,28,.55), rgba(12,12,28,.72)), url('shouye.jpg'), url('shouye.jpg'), linear-gradient(135deg, #2b2b3a, #3a3545); background-size: cover, cover, cover, auto; background-position: center; background-repeat: no-repeat; }
.home-title-area { position: absolute; left: 6vw; top: 50%; transform: translateY(-50%); display: flex; align-items: flex-start; gap: 1.6vw; }
.brush-title { writing-mode: vertical-rl; font-family: var(--f-brush); font-weight: 400; font-size: clamp(3em, 12vh, 6em); color: #f5ede3; letter-spacing: .15em; text-shadow: 0 3px 22px rgba(0,0,0,.65); }
.title-side { display: flex; gap: .9vw; align-items: flex-start; padding-top: .7em; }
.sub-v { writing-mode: horizontal-tb; font-size: clamp(.85em,2.2vh,1.1em); color: rgba(245,240,230,.7); letter-spacing: .35em; font-family: var(--f-title); animation: float 3s ease-in-out infinite; }
.seal { writing-mode: vertical-rl; background: #9e2b2b; color: #fff; font-family: var(--f-brush); font-size: clamp(.75em,1.9vh,.95em); padding: .45em .35em; border-radius: 4px; box-shadow: 0 2px 10px rgba(0,0,0,.45); animation: float 3s ease-in-out infinite .6s; opacity: .7; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }.home-center { position: absolute; left: 50%; bottom: 5vh; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 1.6vh; }
.guide { font-style: italic; color: rgba(245,240,230,.6); font-size: clamp(.8em,1.9vh,.95em); text-align: center; font-family: var(--f-story); }
.btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,.45); color: #f0e6d3; padding: clamp(11px,1.8vh,16px) 0; width: clamp(220px,32vw,320px); font-size: clamp(1em,2.4vh,1.25em); letter-spacing: .4em; text-indent: .4em; border-radius: 3px; cursor: pointer; font-family: inherit; transition: all .3s; }
.btn-ghost:active { background: rgba(255,255,255,.15); border-color: #e94560; transform: scale(.96); }
.btn-ghost:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.7); }
.home-func { position: absolute; right: 3vw; bottom: 4vh; display: flex; flex-direction: column; gap: 1vh; }
.home-func button { background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.18); color: rgba(240,230,211,.85); padding: clamp(8px,1.4vh,12px) clamp(12px,1.8vw,18px); border-radius: 8px; font-size: clamp(.8em,1.9vh,.95em); cursor: pointer; font-family: inherit; transition: all .25s; text-align: center; }
.home-func button:active { background: rgba(255,255,255,.15); transform: scale(.96); }
.home-func button:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.4); }
.home-meta { position: absolute; left: 2.5vw; bottom: 6vh; display: flex; gap: 1.4em; font-size: clamp(.7em,1.6vh,.85em); color: rgba(240,230,211,.5); }
.version-tag { position: absolute; left: 2.5vw; bottom: 2.2vh; font-size: clamp(.6em,1.4vh,.75em); color: rgba(240,230,211,.28); cursor: pointer; transition: transform .12s; user-select: none; }
.version-tag:active { transform: scale(.9); }
.project-cz { position: absolute; right: 2.5vw; bottom: 2.2vh; font-size: clamp(.6em,1.4vh,.75em); color: rgba(240,230,211,.35); letter-spacing: .22em; user-select: none; }

/* ===== 全局按钮 ===== */
.fullscreen-btn { position: fixed; top: 1.5vh; right: 1.5vw; z-index: 50; padding: clamp(8px,1.5vh,12px) clamp(14px,2vw,20px); background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.3); border-radius: 8px; color: #fff; cursor: pointer; font-family: inherit; font-size: clamp(.8em,1.8vh,.95em); transition: opacity .5s ease; }
.fullscreen-btn.hidden { opacity: 0; pointer-events: none; }
.fullscreen-btn:active { transform: scale(.96); }
.music-btn { position: fixed; top: calc(1.5vh + 52px); left: 1.5vw; z-index: 50; padding: clamp(8px,1.5vh,12px) clamp(14px,2vw,20px); background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.3); border-radius: 8px; color: #fff; cursor: pointer; font-family: inherit; font-size: clamp(.9em,2vh,1.1em); }
.music-btn.hidden { display: none; }
.music-btn:active { transform: scale(.96); }
.btn-back { position: absolute; top: 1.5vh; left: 1.5vw; padding: clamp(10px,1.8vh,16px) clamp(18px,3vw,28px); background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.3); border-radius: 8px; color: #fff; cursor: pointer; font-family: inherit; font-size: clamp(.8em,1.9vh,.95em); letter-spacing: .15em; transition: all .25s; z-index: 15; }
.btn-back:active { background: rgba(255,255,255,.15); transform: scale(.96); }
.btn-back:hover { background: rgba(255,255,255,.2); }/* ===== 游戏主界面 ===== */
#pg-game { justify-content: flex-end; padding-bottom: 2vh; }
.scene-image-wrap { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.scene-image-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
.scene-img-fallback { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; background: rgba(0,0,0,.3); color: rgba(255,255,255,.35); font-size: clamp(1em,2.5vh,1.4em); font-family: var(--f-ui); letter-spacing: .1em; }
.char-area { flex: 1; display: flex; align-items: center; justify-content: center; font-size: clamp(3em,8vh,5em); opacity: .3; width: 100%; z-index: 2; position: relative; }
#char-icon { transition: transform .15s, opacity .15s; }
.dialogue-wrap { position: relative; width: min(92%, 760px); margin: 0 auto; z-index: 5; }
.char-name-plate { position: absolute; bottom: 100%; left: clamp(14px,2.5vw,24px); margin-bottom: clamp(4px,.8vh,8px); background: var(--bg-glass); backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur)); border: 1px solid var(--border-glass); border-radius: 8px; padding: clamp(5px,.9vh,9px) clamp(14px,2vw,20px); font-family: var(--f-story); font-weight: bold; font-size: clamp(1em,2.2vh,1.25em); color: #ff8aa0; z-index: 6; white-space: nowrap; }
.dialogue-box { background: var(--bg-glass); backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur)); padding: clamp(14px,2.2vh,22px) clamp(20px,3vw,32px); padding-bottom: clamp(26px,4vh,38px); border-radius: 14px; border: 1px solid var(--border-glass); min-height: clamp(90px,16vh,130px); cursor: pointer; width: 100%; position: relative; z-index: 5; box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
.dlg-text { font-family: var(--f-story); line-height: 1.7; font-size: clamp(1em,2.3vh,1.2em); color: #f3f1ea; white-space: pre-wrap; }
.dlg-hint { position: absolute; right: clamp(10px,1.5vw,16px); bottom: clamp(6px,1vh,10px); font-size: clamp(.62em,1.4vh,.78em); color: rgba(255,255,255,.38); letter-spacing: .12em; animation: breathe 2s ease-in-out infinite; }
@keyframes breathe { 0%,100% { opacity: .4; } 50% { opacity: .9; } }
.choices { position: absolute; bottom: calc(100% + 1.2vh); right: 0; display: none; flex-direction: column; gap: 1vh; width: clamp(230px,32vw,360px); z-index: 20; }
.choices.show { display: flex; }
.choice-btn { padding: clamp(9px,1.6vh,14px) clamp(14px,2vw,20px); background: var(--bg-glass); backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur)); border: 1px solid var(--border-glass); border-radius: 10px; color: #f3f1ea; cursor: pointer; font-size: clamp(.85em,2vh,1.02em); font-family: var(--f-story); text-align: center; line-height: 1.5; transition: all .2s; text-shadow: 0 1px 4px rgba(0,0,0,.5); pointer-events: auto; position: relative; z-index: 20; opacity: 0; transform: translateY(12px); }
.choice-btn.show { opacity: 1; transform: translateY(0); }
.choice-btn:active { background: rgba(233,69,96,.4); border-color: #e94560; transform: scale(.96); }
.choice-btn:hover { background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.6); } .choice-btn.locked { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.8); }
.toolbar { position: absolute; top: calc(1.5vh + 52px); right: 1.5vw; display: flex; flex-direction: column; align-items: center; gap: 1vh; z-index: 15; }
.toolbar button { width: clamp(40px,6vh,54px); height: clamp(40px,6vh,54px); border: none; background: transparent; color: rgba(255,255,255,.85); cursor: pointer; font-size: clamp(1.3em,2.8vh,1.7em); display: flex; align-items: center; justify-content: center; transition: all .2s; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.toolbar button:active { transform: scale(.96); color: #e94560; }
.toolbar button:hover { color: #fff; }/* ===== 存档管理页 ===== */
.slot-page-title { font-family: var(--f-title); font-size: clamp(1.6em,4vh,2.2em); color: #f4d03f; margin-bottom: 2vh; letter-spacing: .2em; }
.tabs { display: flex; gap: 1vw; margin-bottom: 2vh; }
.tab { padding: clamp(8px,1.4vh,12px) clamp(20px,3vw,30px); background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.2); border-radius: 8px; color: rgba(240,230,211,.6); cursor: pointer; font-family: inherit; font-size: clamp(.85em,2vh,1em); transition: all .25s; }
.tab.on { background: rgba(233,69,96,.3); border-color: #e94560; color: #fff; }
.tab:hover { background: rgba(255,255,255,.1); }
.slot-list { width: min(90%, 600px); max-height: 52vh; overflow-y: auto; display: flex; flex-direction: column; gap: 1vh; padding: 0 4px; }
.slot-card { background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.15); border-radius: 10px; padding: clamp(12px,1.8vh,16px) clamp(14px,2vw,20px); cursor: pointer; transition: all .2s; }
.slot-card:active { background: rgba(255,255,255,.1); transform: scale(.98); }
.slot-card:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.3); }
.slot-title { font-size: clamp(.9em,2vh,1.05em); color: #f0e6d3; margin-bottom: .4vh; }
.slot-time { font-size: clamp(.72em,1.6vh,.85em); color: rgba(240,230,211,.5); }
.slot-empty { color: rgba(240,230,211,.3); font-style: italic; }
.slot-actions { display: flex; gap: .8vw; margin-top: .8vh; }
.slot-actions button { padding: clamp(5px,.9vh,8px) clamp(12px,1.8vw,18px); background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); border-radius: 6px; color: #f0e6d3; cursor: pointer; font-family: inherit; font-size: clamp(.7em,1.5vh,.82em); transition: all .2s; }
.slot-actions button:active { background: rgba(255,255,255,.25); transform: scale(.95); }
.slot-actions button:hover { background: rgba(255,255,255,.2); }

/* ===== 设置页 ===== */

.settings-panel { opacity: 0; 
  width: min(92%, 520px);
  max-height: 80vh;
  background: rgba(20, 18, 30, 0.45), var(--bg-glass);
  background-image: radial-gradient(circle at 30% 40%, rgba(220, 180, 140, 0.10) 0%, transparent 70%), radial-gradient(circle at 70% 60%, rgba(200, 170, 130, 0.06) 0%, transparent 60%);
  backdrop-filter: blur(6px) saturate(1.3);
  -webkit-backdrop-filter: blur(6px) saturate(1.3);
  border: 1.5px solid var(--border-glass);
  border-top: 1px solid rgba(230, 210, 185, 0.35);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform-origin: top right;
  transform: scale(0.6) translate(15vw, -12vh);
  transition: opacity 0.2s ease-out, transform 0.2s ease-out; box-shadow: 0 8px 32px rgba(0,0,0,.18), 0 2px 8px rgba(100,70,40,.08), inset 0 1px 0 rgba(255,235,210,.15);
  will-change: transform, backdrop-filter;
}
@keyframes liquidFlow { 0% { background-position: 0% 0%; } 50% { background-position: 100% 50%; } 100% { background-position: 50% 100%; } }
.settings-title { font-family: var(--f-title); font-size: clamp(1.4em,3.5vh,1.8em); color: #f4d03f; text-align: center; letter-spacing: .3em; margin-bottom: 1vh; }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 1vw; padding: .6vh 0; }
.setting-label { font-size: clamp(.85em,1.9vh,1em); color: rgba(240,230,211,.85); min-width: 5em; }
.setting-value { flex: 1; display: flex; justify-content: flex-end; }
.setting-value input[type="range"] { width: 100%; max-width: 180px; accent-color: #e94560; }
.toggle-btn { padding: clamp(6px,1vh,9px) clamp(14px,2vw,20px); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.25); border-radius: 6px; color: rgba(240,230,211,.7); cursor: pointer; font-family: inherit; font-size: clamp(.8em,1.7vh,.92em); transition: all .25s; }
.toggle-btn.active { background: rgba(76,175,80,.35); border-color: #4caf50; color: #fff; }
.toggle-btn:hover { background: rgba(255,255,255,.15); }
.btn-logout { width: 100%; padding: clamp(10px,1.6vh,14px); background: rgba(233,69,96,.25); border: 1px solid rgba(233,69,96,.5); border-radius: 8px; color: #ff8a9e; cursor: pointer; font-family: inherit; font-size: clamp(.85em,1.9vh,1em); margin-top: 1vh; transition: all .25s; }
.btn-logout:active { background: rgba(233,69,96,.45); transform: scale(.97); }
.btn-logout:hover { background: rgba(233,69,96,.35); }
.btn-close-settings { width: 100%; padding: clamp(10px,1.6vh,14px); background: transparent; border: 1px solid rgba(255,255,255,.35); border-radius: 8px; color: #f0e6d3; cursor: pointer; font-family: inherit; font-size: clamp(.85em,1.9vh,1em); transition: all .25s; }
.btn-close-settings:active { background: rgba(255,255,255,.12); transform: scale(.97); }
.btn-close-settings:hover { background: rgba(255,255,255,.1); }/* ===== 回顾面板 ===== */
.review-mask { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; opacity: 0; pointer-events: none; transition: opacity .35s; }
.review-mask.show { opacity: 1; pointer-events: auto; }
.review-panel { position: fixed; top: 0; right: 0; width: min(88vw, 420px); height: 100%; background: rgba(15,15,30,.96); border-left: 1px solid rgba(255,255,255,.15); z-index: 201; transform: translateX(105%); transition: transform .4s cubic-bezier(.22,1,.36,1); display: flex; flex-direction: column; }
.review-panel.show { transform: translateX(0); }
.review-head { display: flex; align-items: center; justify-content: space-between; padding: clamp(14px,2vh,20px) clamp(16px,2.5vw,24px); border-bottom: 1px solid rgba(255,255,255,.12); }
.review-title { font-family: var(--f-title); font-size: clamp(1.1em,2.5vh,1.35em); color: #f4d03f; }
.review-close { background: none; border: none; color: rgba(255,255,255,.6); font-size: clamp(1.2em,2.5vh,1.5em); cursor: pointer; padding: .2em; transition: color .2s; }
.review-close:active { color: #e94560; }
.review-list { flex: 1; overflow-y: auto; padding: clamp(12px,2vh,18px) clamp(14px,2vw,20px); display: flex; flex-direction: column; gap: 1.2vh; }
.review-item { font-family: var(--f-story); font-size: clamp(.82em,1.8vh,.95em); line-height: 1.6; color: rgba(243,241,234,.85); padding: clamp(8px,1.2vh,12px) clamp(10px,1.5vw,14px); background: rgba(255,255,255,.05); border-radius: 8px; border-left: 3px solid rgba(233,69,96,.5); }

/* ===== 确认弹窗 ===== */
.confirm-mask { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 300; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .3s; }
.confirm-mask.show { opacity: 1; pointer-events: auto; }
.confirm-box { background: var(--bg-glass); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); border: 1px solid var(--border-glass); border-top: 1px solid rgba(230, 210, 185, 0.35); border-radius: 14px; padding: clamp(22px,3.5vh,32px) clamp(22px,4vw,34px); width: min(88%, 340px); text-align: center; transform: scale(.9); transition: transform .3s; box-shadow: 0 8px 32px rgba(0,0,0,.18), 0 2px 8px rgba(100,70,40,.08), inset 0 1px 0 rgba(255,235,210,.15); background-image: radial-gradient(circle at 30% 40%, rgba(220, 180, 140, 0.10) 0%, transparent 70%), radial-gradient(circle at 70% 60%, rgba(200, 170, 130, 0.06) 0%, transparent 60%); }
.confirm-mask.show .confirm-box { transform: scale(1); }
.confirm-title { font-family: var(--f-title); font-size: clamp(1.1em,2.5vh,1.35em); color: #f4d03f; margin-bottom: 1.2vh; }
.confirm-desc { font-size: clamp(.85em,1.9vh,1em); color: rgba(240,230,211,.8); margin-bottom: 2.2vh; line-height: 1.6; }
.confirm-actions { display: flex; gap: 1vw; }
.confirm-actions button { flex: 1; padding: clamp(9px,1.5vh,13px); background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); border-radius: 8px; color: #f0e6d3; cursor: pointer; font-family: inherit; font-size: clamp(.85em,1.9vh,1em); transition: all .2s; }
.confirm-actions button:active { background: rgba(255,255,255,.22); transform: scale(.96); }
.confirm-actions button:hover { background: rgba(255,255,255,.18); }
.confirm-actions button.danger { background: rgba(233,69,96,.3); border-color: rgba(233,69,96,.6); color: #ff9eae; }
.confirm-actions button.danger:active { background: rgba(233,69,96,.5); }

/* ===== 提示气泡 ===== */
#toast { position: fixed; bottom: clamp(6vh,8vh,10vh); left: 50%; transform: translateX(-50%) translateY(20px); background: var(--bg-glass); backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur)); border: 1px solid var(--border-glass); color: #fff; padding: clamp(10px,1.6vh,14px) clamp(20px,3vw,30px); border-radius: 999px; font-size: clamp(.82em,1.8vh,.95em); z-index: 500; opacity: 0; pointer-events: none; transition: all .35s; white-space: nowrap; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== 收录徽章 ===== */
.unlock-badge { position: fixed; top: clamp(8vh,10vh,12vh); left: 50%; transform: translateX(-50%) scale(0); background: linear-gradient(135deg, #f4d03f, #e67e22); color: #1a1a2e; padding: clamp(10px,1.6vh,14px) clamp(22px,3.5vw,32px); border-radius: 999px; font-family: var(--f-title); font-size: clamp(.9em,2vh,1.1em); z-index: 400; transition: transform .45s cubic-bezier(.68,-.55,.27,1.55); box-shadow: 0 4px 20px rgba(244,208,63,.4); }
.unlock-badge.show { transform: translateX(-50%) scale(1); }

  /* ===== 好感度与成长系统 UI ===== */
  .stats-panel { margin-top: 1.5vh; border-top: 1px solid rgba(255,255,255,.15); padding-top: 1.5vh; }

    </div>

    <div class="home-title-area">

      <div class="title-side">

        <div class="seal">测试版</div>
      </div>

    <div class="home-center">
      <div class="guide">— 新学期 · 新的相遇 —</div>
      <button class="btn-ghost" onclick="newGame()">新的篇章</button>
      <button class="btn-ghost" onclick="continueGame()">继续旅程</button>

    <div class="home-func">
      <button onclick="openSlots()" data-icon="folder">存档</button>

      <button onclick="openAch()" data-icon="trophy">成就</button>
      <button onclick="openCodex()" data-icon="book">图鉴</button>

    <div class="home-meta">
      <span>测试版</span>
      <span>本地存档</span>
    </div>

  </div>

  </div>

// ===== 安全解析 localStorage =====
function safeParse(key, defaultVal) {
  try {
    var data = localStorage.getItem(key);
    return data ? JSON.parse(data) : defaultVal;
  } catch (e) {
    console.warn('读取数据失败:', key, e);
    return defaultVal;
  }
}

// ============================================================
// 【SHA-256 哈希函数】
// ============================================================
async function sha256(message) {
  var encoder = new TextEncoder();
  var data = encoder.encode(message);
  var hashBuffer = await crypto.subtle.digest('SHA-256', data);
  var hashArray = Array.from(new Uint8Array(hashBuffer));
  var hashHex = hashArray.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
  return hashHex;
}

// ============================================================
function changeFavorability(char, delta) {
  favorability[char] = (favorability[char] || 0) + delta;
  // 数值边界限制
  if (favorability[char] > 20) favorability[char] = 20;
  if (favorability[char] < -10) favorability[char] = -10;
  updateStatsUI();
  // 显示浮动提示
  var sign = delta > 0 ? '+' : '';
  // showToast(char + ' 好感度' + sign + delta);
}

function changeStat(statName, delta) {
  stats[statName] = (stats[statName] || 0) + delta;
  // 数值边界限制
  if (stats[statName] > 25) stats[statName] = 25;
  if (stats[statName] < 0) stats[statName] = 0;
  updateStatsUI();
  var label = { de: '德', zhi: '智', ti: '体', mei: '美' }[statName] || statName;
  var sign = delta > 0 ? '+' : '';
  // showToast(label + ' ' + sign + delta);
}

function applyChanges(changes) {
  if (changes.fav) {
    for (var char in changes.fav) {
      changeFavorability(char, changes.fav[char]);
    }
  }
  if (changes.stat) {
    for (var s in changes.stat) {
      changeStat(s, changes.stat[s]);
    }
  }
}

function checkFavorability(character, minValue) {
  return (favorability[character] || 0) >= minValue;
}

function checkStat(statName, minValue) {
  return (stats[statName] || 0) >= minValue;
}

function checkCombination(conditions) {
  if (conditions.fav) {
    for (var char in conditions.fav) {
      if (!checkFavorability(char, conditions.fav[char])) return false;
    }
  }
  if (conditions.stat) {
    for (var s in conditions.stat) {
      if (!checkStat(s, conditions.stat[s])) return false;
    }
  }
  return true;
}

function getFavLabel(val) {
  if (val <= -5) return '️ 冷淡';
  if (val <= 4) return '─ 中立';
  if (val <= 10) return ' 友好';
  if (val <= 15) return '❤️ 亲密';
  return ' 挚友';
}

function getStatLabel(val) {
  if (val <= 5) return ' 萌芽';
  if (val <= 10) return ' 成长';
  if (val <= 15) return ' 成熟';
  return ' 卓越';
}

function initLogin() {
  var overlay = document.getElementById('login-overlay');
  var panel = document.getElementById('login-panel');
  var accountInput = document.getElementById('login-account');
  var passwordInput = document.getElementById('login-password');
  var errorText = document.getElementById('login-error');
  var loginBtn = document.getElementById('login-btn');
  if (!overlay || !accountInput || !passwordInput || !loginBtn) return;

  // 检查是否已登录
  if (localStorage.getItem('logged_user')) {
    overlay.style.display = 'none';
    return;
  }

  function showLoginError(msg) {
    if (errorText) {
      errorText.textContent = msg || '账号或密码错误，请重试';
      errorText.classList.add('show');
    }
    if (panel) {
      panel.classList.remove('shake');
      void panel.offsetWidth;
      panel.classList.add('shake');
      setTimeout(function() { panel.classList.remove('shake'); }, 450);
    }
  }

  function showForgotPassword(account) {
    var msg = '账号 "' + account + '" 已因连续输错 ' + CONFIG.MAX_LOGIN_ATTEMPTS + ' 次密码被锁定。\n\n' +
              '如需重置密码，请联系管理员：\n' +
              '📱 13857113238\n\n' +
              '点击「确定」复制手机号，点击「取消」关闭';
    var confirmResult = confirm(msg);
    if (confirmResult) {
      copyToClipboard('13857113238');
      alert('📱 手机号已复制，请去联系管理员重置密码');
    }
  }

  function copyToClipboard(text) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).catch(function() {});
    } else {
      var input = document.createElement('input');
      input.value = text;
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      document.body.removeChild(input);
    }
  }

  async function doLogin() {
    var acc = accountInput.value.trim();
    var pwd = passwordInput.value.trim();
    if (!acc || !pwd) { showLoginError('请输入账号和密码'); return; }

    // 查找用户
    var user = null;
    for (var i = 0; i < ACCOUNT_POOL.length; i++) {
      if (ACCOUNT_POOL[i].account === acc) {
        user = ACCOUNT_POOL[i];
        break;
      }
    }

    if (!user) {
      showLoginError('账号不存在');
      return;
    }

    // 计算密码哈希
    var hashedInput = await sha256(pwd + CONFIG.SALT);

    if (user.passwordHash === hashedInput) {
      // 登录成功 → 重置失败计数
      user.failCount = 0;
      localStorage.setItem('logged_user', JSON.stringify({ account: acc, time: Date.now() }));
      if (errorText) errorText.classList.remove('show');
      overlay.classList.add('fade-out');
      setTimeout(function() { overlay.style.display = 'none'; }, 600);
      // 播放BGM（用户点击触发，绕过浏览器限制）
      var bgm = document.getElementById('bgm');
      if (bgm) {
        bgm.volume = 0.5;
        bgm.play().catch(function() {});
      }
      showToast('欢迎回来，' + acc);
    } else {
      // 登录失败 → 增加失败计数
      user.failCount = (user.failCount || 0) + 1;
      var remaining = CONFIG.MAX_LOGIN_ATTEMPTS - user.failCount;
      if (user.failCount >= CONFIG.MAX_LOGIN_ATTEMPTS) {
        showLoginError('账号已锁定，请联系管理员');
        setTimeout(function() { showForgotPassword(acc); }, 300);
      } else {
        showLoginError('密码错误（剩余 ' + remaining + ' 次机会）');
      }
    }
  }

  loginBtn.addEventListener('click', doLogin);
  accountInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') passwordInput.focus();
  });
  passwordInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
}

function logout() {
  localStorage.removeItem('logged_user');
  // ===== 清除好感度与成长系统数据 =====
  localStorage.removeItem('cz_favorability');
  localStorage.removeItem('cz_stats');
  favorability = { '陈屿': 0, '林小满': 0, '班主任': 0, '麒麟': 0, '小老鼠': 0 };

  if (pwdInput) pwdInput.value = '';

// 【多媒体素材探测与加载】
// ============================================================
var mediaCache = {};

function detectMedia(fileName, type) {
  if (!fileName) return null;
  if (mediaCache[fileName]) return mediaCache[fileName];
  var exts = [];
  if (type === 'image') exts = ['.webp', '.jpg', '.jpeg', '.png', '.avif'];
  else if (type === 'audio') exts = ['.mp3', '.m4a', '.aac', '.ogg', '.wav', '.flac'];
  else if (type === 'video') exts = ['.mp4', '.webm', '.mov', '.avi'];
  else return null;
  mediaCache[fileName] = fileName + exts[0];
  return mediaCache[fileName];
}

function loadMediaForLine(line) {
  var wrap = document.getElementById('scene-image-wrap');
  if (!wrap) return;
  wrap.innerHTML = '';
  showLoadingIndicator(wrap);
  if (line.video) {
    tryVideoFormats(line.video, wrap);
    return;
  }
  if (line.img) {
    tryImageFormats(line.img, wrap);
    return;
  }
  if (line.sfx) {
    playAudio(line.sfx);
  }
  hideLoadingIndicator(wrap);
}

function tryImageFormats(baseName, wrap) {
  var exts = ['.webp', '.jpg', '.jpeg', '.png', '.avif'];
  var index = 0;
  function next() {
    if (index >= exts.length) {
      hideLoadingIndicator(wrap);
      var fb = document.createElement('div');
      fb.className = 'scene-img-fallback';
      fb.textContent = baseName + ' 未加载';
      wrap.appendChild(fb);
      return;
    }
    var url = baseName + exts[index];
    var img = new Image();
    img.onload = function() {
      hideLoadingIndicator(wrap);
      wrap.innerHTML = '';
      img.style.maxWidth = '100%';
      img.style.maxHeight = '100%';
      img.style.objectFit = 'contain';
      wrap.appendChild(img);
    };
    img.onerror = function() {
      index++;
      next();
    };
    img.src = url;
  }
  next();
}

function tryVideoFormats(baseName, wrap) {
  var exts = ['.mp4', '.webm', '.mov'];
  var index = 0;
  function next() {
    if (index >= exts.length) {
      hideLoadingIndicator(wrap);
      var fb = document.createElement('div');
      fb.className = 'scene-img-fallback';
      fb.textContent = baseName + ' 视频未加载';
      wrap.appendChild(fb);
      return;
    }
    var url = baseName + exts[index];
    var video = document.createElement('video');
    video.src = url;
    video.autoplay = true;
    video.muted = true;
    video.loop = false;
    video.playsInline = true;
    video.style.maxWidth = '100%';
    video.style.maxHeight = '100%';
    video.style.objectFit = 'contain';
    video.onloadeddata = function() {
      hideLoadingIndicator(wrap);
      wrap.innerHTML = '';
      wrap.appendChild(video);
    };
    video.onerror = function() {
      index++;
      next();
    };
  }
  next();
}

function playAudio(baseName) {
  var exts = ['.mp3', '.m4a', '.aac', '.ogg', '.wav', '.flac'];
  var index = 0;
  function next() {
    if (index >= exts.length) return;
    var audio = new Audio();
    audio.src = baseName + exts[index];
    audio.volume = 0.5;
    audio.oncanplay = function() {
      audio.play().catch(function() {});
    };
    audio.onerror = function() {
      index++;
      next();
    };
  }
  next();
}

function showLoadingIndicator(wrap) {
  var loading = wrap.querySelector('.loading-overlay');
  if (!loading) {
    loading = document.createElement('div');
    loading.className = 'loading-overlay';
    loading.innerHTML = '<div class="loading-spinner"></div>';
    wrap.appendChild(loading);
  }
  loading.classList.add('show');
}

function hideLoadingIndicator(wrap) {
  var loading = wrap.querySelector('.loading-overlay');
  if (loading) loading.classList.remove('show');
}

function preloadNextLine() {

  }
}

// ===== 动态文本解析：根据好感度数值返回对应台词 =====
function resolveDynamicText(text) {
  if (typeof text === 'string') return text;
  if (typeof text === 'object' && text !== null) {
    var thresholds = Object.keys(text).map(Number).sort(function(a, b) { return a - b; });
    // 使用陈屿的好感度进行分层对话匹配
    var currentFav = favorability['陈屿'] || 0;
    for (var i = thresholds.length - 1; i >= 0; i--) {
      if (currentFav >= thresholds[i]) {
        return text[thresholds[i]];
      }
    }
    return text[thresholds[0]];
  }
  return text;
}

function renderLine() {
  var scene = STORY_DATA[currentScene];
  var line = scene ? scene.lines[currentLine] : null;
  if (!scene || !line) {
    stopAuto(); stopSkip();
    unlockAchievement('chapter_1');
    showToast('—— 本章结束 ——');
    setTimeout(function() { showPage('pg-home'); }, 900);
    return;
  }

  var textEl = document.getElementById('dlg-text');
  var nameEl = document.getElementById('char-name');
  var iconEl = document.getElementById('char-icon');
  var choicesEl = document.getElementById('choices');
  if (!textEl || !nameEl || !iconEl || !choicesEl) return;

  choicesEl.classList.remove('show');
  choicesEl.innerHTML = '';

  loadMediaForLine(line);

  if (line.type === 'narration') {
    nameEl.textContent = '旁白';
    iconEl.textContent = '📖';
    typeText(textEl, resolveDynamicText(line.text));
  } else if (line.type === 'dialogue') {
    nameEl.textContent = line.speaker;
    iconEl.textContent = line.icon || '🧑';
    typeText(textEl, resolveDynamicText(line.text));
  } else if (line.type === 'choice') {
    stopAuto();
    nameEl.textContent = '选择';
    iconEl.textContent = '💭';
    textEl.textContent = line.prompt;
    line.options.forEach(function(opt, idx) {
      var btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.style.pointerEvents = 'auto';
      btn.style.position = 'relative';
      btn.style.zIndex = '20';

      // ===== 处理 requireFav（好感度门槛锁定） =====
      var isLocked = false;
      var lockReason = '';
      if (opt.requireFav) {
        for (var char in opt.requireFav) {
          var required = opt.requireFav[char];
          var current = favorability[char] || 0;
          if (current < required) {
            isLocked = true;
            lockReason = char + ' 好感度不足（需' + required + '，当前' + current + '）';
            break;
          }
        }
      }

      
      // ===== 处理 requireStat（属性门槛锁定） =====
      var isStatLocked = false;
      var statLockReason = '';
      if (opt.requireStat) {
        for (var statName in opt.requireStat) {
          var required = opt.requireStat[statName];
          var current = stats[statName] || 0;
          if (current < required) {
            isStatLocked = true;
            var label = { de: '德', zhi: '智', ti: '体', mei: '美' }[statName] || statName;
            statLockReason = label + '不足（需' + required + '，当前' + current + '）';
            break;
          }
        }
      }
      // ===== 综合锁定状态 =====
      var isOptionLocked = isLocked || isStatLocked;
      if (isOptionLocked) {
        lockReason = lockReason ? lockReason + ' / ' + statLockReason : statLockReason;
      }
// ===== 设置按钮文本 =====
      if (isOptionLocked) {
        btn.textContent = ' ' + opt.text + '（' + lockReason + '）';
        btn.style.opacity = '0.5';
        btn.style.cursor = 'not-allowed';
        btn.style.filter = 'grayscale(0.8)';
      } else {
        btn.textContent = opt.text;
      }

      btn.addEventListener('click', function(e) {
        e.stopPropagation();

        // ===== 锁定选项不可点击 =====
        if (isOptionLocked && opt.hideIfLocked !== true) {
          showToast(' ' + lockReason);
          return;
        }
        if (isOptionLocked && opt.hideIfLocked === true) {
          showToast('该选项不可用');
          return;
        }

        // ===== 处理好感度变化 =====
        if (opt.fav) {
          for (var char in opt.fav) {
            changeFavorability(char, opt.fav[char]);
          }
        }
        // ===== 处理属性变化 =====
        if (opt.stat) {
          for (var s in opt.stat) {
            changeStat(s, opt.stat[s]);
          }
        }

        // ===== 处理 nextScene（场景跳转） =====
        if (opt.nextScene !== undefined) {
          currentScene = opt.nextScene;
          currentLine = 0;
        } else {
          // ===== 处理 requireFav 的 failNext（不达标走分支） =====
          if (isLocked && opt.failNext) {
            currentLine = opt.failNext;
          } else {
            currentLine = opt.next;
          }
        }

        if (idx === 0) unlockAchievement('first_choice');
        renderLine();
      });
      choicesEl.appendChild(btn);
      // 错落入场动画
      setTimeout(function() {
        btn.classList.add('show');
      }, 50 + idx * 60);
    });
    setTimeout(function() { choicesEl.classList.add('show'); }, 50);
  }
}

function typeText(el, text) {
  clearInterval(typeTimer);
  if (skipMode) {
    el.textContent = text;
    isTyping = false;
    return;
  }
  isTyping = true;
  el.textContent = '';
  var i = 0;
  var speed = getSpeed();
  typeTimer = setInterval(function() {
    if (i < text.length) {
      el.textContent += text[i];
      i++;
    } else {
      clearInterval(typeTimer);
      isTyping = false;
      if (autoMode) scheduleAuto();
    }
  }, speed);
}

function getSpeed() {
  var el = document.getElementById('set-speed');
  var val = el ? parseInt(el.value) : 50;
  return Math.max(10, 80 - val * 0.7);
}

function advance() {
  preloadNextLine();
  var scene = STORY_DATA[currentScene];
  if (!scene) return;
  var line = scene.lines[currentLine];
  if (!line || line.type === 'choice') return;
  if (isTyping) {
    clearInterval(typeTimer);
    isTyping = false;
    document.getElementById('dlg-text').textContent = line.text;
    if (autoMode) scheduleAuto();
    return;
  }
  currentLine++;
  renderLine();
}
// ============================================================
// 【自动 / 快进】
// ============================================================
function stopAuto() { autoMode = false; clearTimeout(autoTimer); }
function stopSkip() { skipMode = false; clearInterval(skipTimer); }

function toggleAuto() {
  autoMode = !autoMode;
  showToast(autoMode ? '自动播放：开' : '自动播放：关');
  if (autoMode && !isTyping) scheduleAuto();
  if (!autoMode) clearTimeout(autoTimer);
}

function scheduleAuto() {
  clearTimeout(autoTimer);
  var el = document.getElementById('set-auto-delay');
  var delay = (el ? parseInt(el.value) : 2) * 1000;
  autoTimer = setTimeout(function() { if (autoMode) advance(); }, delay);
}

function toggleSkip() {
  skipMode = !skipMode;
  showToast(skipMode ? '快进模式：开' : '快进模式：关');
  if (skipMode) {
    skipTimer = setInterval(function() {
      var scene = STORY_DATA[currentScene];
      var line = scene ? scene.lines[currentLine] : null;
      if (!scene || !line || line.type === 'choice') {
        toggleSkip();
        return;
      }
      clearInterval(typeTimer);
      isTyping = false;
      currentLine++;
      renderLine();
    }, 200);
  } else {
    clearInterval(skipTimer);
  }
}

// ============================================================
// 【存档系统】
// ============================================================
function saveSilent() {
  var scene = STORY_DATA[currentScene];
  localStorage.setItem('cz_save_auto', JSON.stringify({
    scene: currentScene,
    line: currentLine,
    name: scene ? scene.name : '未知',
    time: new Date().toLocaleString('zh-CN')
  }));
  // ===== 好感度与成长系统持久化 =====
  localStorage.setItem('cz_favorability', JSON.stringify(favorability));
  localStorage.setItem('cz_stats', JSON.stringify(stats));
}

function saveGame() { saveSilent(); showToast('已存档'); }

function loadGame() {
  var data = localStorage.getItem('cz_save_auto');
  if (data) {
    var parsed = JSON.parse(data);
    currentScene = parsed.scene;
    currentLine = parsed.line;
    showPage('pg-game');
    renderLine();
    // ===== 恢复好感度与成长系统数据 =====
    var f = localStorage.getItem('cz_favorability');
    var s = localStorage.getItem('cz_stats');
    if (f) favorability = JSON.parse(f);
    if (s) stats = JSON.parse(s);
    updateStatsUI();
    showToast('已读档');
  } else {
    showToast('暂无存档');
  }
}

function switchTab(tab) {
  currentTab = tab;
  var tabSave = document.getElementById('tab-save');
  var tabLoad = document.getElementById('tab-load');
  if (tabSave) tabSave.classList.toggle('on', tab === 'save');
  if (tabLoad) tabLoad.classList.toggle('on', tab === 'load');
  renderSlots(tab);
}

function renderSlots(tab) {
  var list = document.getElementById('slot-list');
  if (!list) return;
  list.innerHTML = '';
  for (var i = 1; i <= 6; i++) {
    var data = localStorage.getItem('cz_slot_' + i);
    var card = document.createElement('div');
    card.className = 'slot-card';
    if (data) {
      var parsed = JSON.parse(data);
      card.innerHTML =
        '<div class="slot-title">存档 ' + i + ' · ' + (parsed.name || '未命名') + '</div>' +
        '<div class="slot-time">' + (parsed.time || '未知时间') + '</div>' +
        '<div class="slot-actions">' +
        (tab === 'load' ? '<button onclick="loadSlot(' + i + ')">读取</button>' : '') +
        '<button onclick="deleteSlot(' + i + ', event)">删除</button>' +
        '</div>';
    } else {
      card.innerHTML = '<div class="slot-title">存档 ' + i + '</div><div class="slot-time slot-empty">空</div>';
    }
    if (tab === 'save') {
      (function(slotIndex) {
        card.onclick = function() { saveToSlot(slotIndex); };
      })(i);
    }
    list.appendChild(card);
  }
}

function saveToSlot(i) {
  var scene = STORY_DATA[currentScene];
  var data = {
    scene: currentScene,
    line: currentLine,
    name: scene ? scene.name : '未知',
    time: new Date().toLocaleString('zh-CN')
  };
  var key = 'cz_slot_' + i;
  if (localStorage.getItem(key)) {
    showConfirm('覆盖存档', '存档 ' + i + ' 已有数据，确定覆盖？', function() {
      localStorage.setItem(key, JSON.stringify(data));
      showToast('已保存到存档 ' + i);
      renderSlots(currentTab);
    });
  } else {
    localStorage.setItem(key, JSON.stringify(data));
    showToast('已保存到存档 ' + i);
    renderSlots(currentTab);
  }
}

function loadSlot(i) {
  var data = localStorage.getItem('cz_slot_' + i);
  if (data) {
    var parsed = JSON.parse(data);
    currentScene = parsed.scene;
    currentLine = parsed.line;
    showPage('pg-game');
    renderLine();
    showToast('已读取存档 ' + i);
  }
}

function deleteSlot(i, e) {
  if (e && e.stopPropagation) e.stopPropagation();
  localStorage.removeItem('cz_slot_' + i);
  showToast('存档 ' + i + ' 已删除');
  renderSlots(currentTab);
}

// ============================================================
// 【回顾面板】
// ============================================================
function openReview() {
  var scene = STORY_DATA[currentScene];
  var list = document.getElementById('review-list');
  if (!list) return;
  list.innerHTML = '';
  if (scene) {
    for (var i = 0; i <= currentLine && i < scene.lines.length; i++) {
      var line = scene.lines[i];
      if (line.type === 'choice') continue;
      var item = document.createElement('div');
      item.className = 'review-item';
      if (line.type === 'narration') {
        item.innerHTML = '<span style="color:rgba(255,255,255,.5)">[旁白]</span> ' + line.text;
      } else {
        item.innerHTML = '<strong style="color:#ff8aa0">' + line.speaker + '</strong>：' + line.text;
      }
      list.appendChild(item);
    }
  }
  var mask = document.getElementById('review-mask');
  var panel = document.getElementById('review-panel');
  if (mask) mask.classList.add('show');
  if (panel) panel.classList.add('show');
  list.scrollTop = list.scrollHeight;
}

function closeReview() {
  var mask = document.getElementById('review-mask');
  var panel = document.getElementById('review-panel');
  if (mask) mask.classList.remove('show');
  if (panel) panel.classList.remove('show');
}

// 【图鉴系统】
// ============================================================
function openCodex() {
  renderCodex();
  var mask = document.getElementById('codex-mask');
  if (mask) mask.classList.add('show');
}

function closeCodex() {
  var mask = document.getElementById('codex-mask');
  if (mask) mask.classList.remove('show');
}

function renderCodex() {
  var body = document.getElementById('codex-body');
  if (!body) return;
  body.innerHTML = '';
  CODEX_DATA.forEach(function(item) {
    var unlocked = codexUnlocked.indexOf(item.id) !== -1;
    var div = document.createElement('div');
    div.className = 'codex-item ' + (unlocked ? 'unlocked' : 'locked');
    div.innerHTML =
      '<div class="ci-icon">' + (unlocked ? item.icon : '🔒') + '</div>' +
      '<div class="ci-name">' + (unlocked ? item.name : '???') + '</div>' +
      '<div class="ci-desc">' + (unlocked ? item.desc : '尚未解锁') + '</div>';
    body.appendChild(div);
  });
}

function unlockCodex(id) {
  if (codexUnlocked.indexOf(id) === -1) {
    codexUnlocked.push(id);
    localStorage.setItem('cz_codex', JSON.stringify(codexUnlocked));
  }
}

// ============================================================
// 【液态玻璃成就系统】
// ============================================================
function unlockAchievement(id) {
  if (achievements[id]) return;
  achievements[id] = true;
  localStorage.setItem('cz_achievements', JSON.stringify(achievements));
  var data = null;
  for (var i = 0; i < ACHIEVEMENT_DATA.length; i++) {
    if (ACHIEVEMENT_DATA[i].id === id) { data = ACHIEVEMENT_DATA[i]; break; }
  }
  if (!data) return;
  showGlassAchievement(data.title, data.condition, data.icon);
  if (id === 'first_meet') { unlockCodex('lin'); unlockCodex('chen'); }
  if (id === 'chapter_1') { unlockCodex('school'); unlockCodex('autumn'); }
}

function showGlassAchievement(title, desc, icon) {
  var container = document.getElementById('glass-achievement-container');
  if (!container) return;

  var ach = document.createElement('div');
  ach.className = 'glass-achievement';
  ach.innerHTML =
    '<div class="ga-icon">' + (icon || '🏆') + '</div>' +
    '<div class="ga-text">' +
      '<div class="ga-label">✦ 成就达成</div>' +
      '<div class="ga-title">' + title + '</div>' +
    '</div>';

  container.appendChild(ach);

  // 触发入场动画
  requestAnimationFrame(function() {
    ach.classList.add('show');
  });

  // 自动移除
  setTimeout(function() {
    ach.classList.remove('show');
    setTimeout(function() {
      if (ach.parentNode) ach.parentNode.removeChild(ach);
    }, 500);
  }, CONFIG.ACHIEVEMENT_DURATION);
}

// ============================================================
// 【确认弹窗】
// ============================================================
var confirmCallback = null;

function showConfirm(title, desc, callback) {
  var mask = document.getElementById('confirm-mask');
  var titleEl = document.getElementById('confirm-title');
  var descEl = document.getElementById('confirm-desc');
  if (!mask || !titleEl || !descEl) return;
  titleEl.textContent = title;
  descEl.textContent = desc;
  mask.classList.add('show');
  confirmCallback = callback;
  var okBtn = document.getElementById('confirm-ok');
  if (okBtn) {
    okBtn.onclick = function() {
      hideConfirm();
      if (confirmCallback) confirmCallback();
    };
  }
}

function hideConfirm() {
  var mask = document.getElementById('confirm-mask');
  if (mask) mask.classList.remove('show');
  confirmCallback = null;
}

// ============================================================
// 【设置】
// ============================================================
function toggleBGM() {
  var btn = document.getElementById('toggle-bgm');
  if (!btn) return;
  var isOn = btn.classList.contains('active');
  btn.classList.toggle('active');
  btn.textContent = isOn ? '关闭' : '开启';
  var bgm = document.getElementById('bgm');
  if (bgm) {
    if (isOn) {
      bgm.pause();
    } else {
      bgm.play().catch(function() {});
    }
  }
}

// ============================================================
// 【增强版彩蛋】
// ============================================================
var eggCount = 0, eggResetTimer = null;

function tapVersion() {
  eggCount++;
  clearTimeout(eggResetTimer);
  eggResetTimer = setTimeout(function() { eggCount = 0; }, 1500);
  if (eggCount >= 10) {
    eggCount = 0;
    triggerEgg();
  }
}

function triggerEgg() {
  var overlay = document.getElementById('egg-overlay');
  if (!overlay) return;
  overlay.classList.add('show');
  unlockAchievement('egg_hunter');
  var app = document.getElementById('app');
  if (app) {
    app.style.animation = 'none';
    void app.offsetWidth;
    app.style.animation = 'screenShake .5s ease .7s';
  }
  spawnFlames();
  setTimeout(function() { hideEgg(); }, 4000);
}

function spawnFlames() {
  for (var i = 0; i < 20; i++) {
    (function(idx) {
      setTimeout(function() {
        var f = document.createElement('div');
        f.className = 'egg-flame';
        f.style.left = (Math.random() * 100) + 'vw';
        f.style.animationDelay = (Math.random() * 0.3) + 's';
        var size = (4 + Math.random() * 6) + 'px';
        f.style.width = size;
        f.style.height = size;
        document.body.appendChild(f);
        setTimeout(function() { if (f.parentNode) f.parentNode.removeChild(f); }, 1200);
      }, idx * 80);
    })(i);
  }
}

function hideEgg() {
  var overlay = document.getElementById('egg-overlay');
  if (overlay) overlay.classList.remove('show');
  var app = document.getElementById('app');
  if (app) app.style.animation = '';
}

// ============================================================
// 【Bug反馈系统 - 修复版】
// ============================================================
function openBugReport() {
  // 检查是否登录
  if (!localStorage.getItem('logged_user')) {
    showToast('请先登录再反馈问题');
    return;
  }

  try {
    var account = '未登录';
    try {
      var logged = localStorage.getItem('logged_user');
      if (logged) account = JSON.parse(logged).account || '未登录';
    } catch(e) {}

    var sceneName = STORY_DATA[currentScene] ? STORY_DATA[currentScene].name : '未知';
    var time = new Date().toLocaleString('zh-CN');
    var ua = navigator.userAgent || '未知浏览器';

    var report = '📋 Bug反馈报告\n' +
      '════════════════════\n' +
      '账号：' + account + '\n' +
      '当前场景：' + sceneName + '\n' +
      '时间：' + time + '\n' +
      '浏览器：' + ua + '\n' +
      '════════════════════\n' +
      '问题描述：\n' +
      '[在此输入你的问题]\n' +
      '\n' +
      '════════════════════\n' +
      '📱 联系管理员：13857113238';

    // 复制到剪贴板（带降级方案）
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(report).then(function() {
        showToast('📋 反馈报告已复制，请粘贴发送给管理员');
      }).catch(function(err) {
        console.warn('clipboard 复制失败，使用降级方案', err);
        fallbackCopy(report);
      });
    } else {
      fallbackCopy(report);
    }
  } catch (e) {
    console.error('Bug反馈出错:', e);
    showToast('❌ 反馈生成失败，请直接联系管理员：13857113238');
  }
}

function fallbackCopy(text) {
  try {
    var input = document.createElement('input');
    input.value = text;
    input.style.position = 'fixed';
    input.style.opacity = '0';
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    document.body.removeChild(input);
    showToast('📋 反馈报告已复制，请粘贴发送给管理员');
  } catch (e) {
    console.error('降级复制也失败了', e);
    showToast('❌ 无法复制，请手动截图反馈');
  }
}
